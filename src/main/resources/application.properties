spring.application.name=refugio-api
server.port=8080

# MongoDB. En produccion MONGODB_URI apunta al cluster (mongodb+srv://..., TLS).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/refugio}
spring.data.mongodb.auto-index-creation=true

spring.jackson.default-property-inclusion=non_null

# Token de sesion (HU-02). Minimo 32 caracteres; cambiar en produccion.
refugio.jwt.secreto=${JWT_SECRETO:refugio-clave-secreta-de-desarrollo-cambiar-en-produccion-2026}
refugio.jwt.horas-expiracion=8
